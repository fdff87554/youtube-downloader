[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-downloader-backend"
# Read from app/__init__.py so the value the API reports and the value
# the package declares cannot drift. Kept in step with the git tag,
# which is what releases and the GHCR image tags are cut from. This
# package is never published to an index.
dynamic = ["version"]
description = "Privacy-first YouTube downloader backend"
requires-python = ">=3.14"
dependencies = [
    # 0.121.0 is the earliest release that pulls starlette>=0.49.1, the fix
    # line for CVE-2025-62727 (fastapi<0.124 pinned starlette<0.51, which is
    # structurally below the CVE-2026-48710 fix). Cap below 0.142 so
    # dependabot surfaces further bumps as PRs rather than letting CI float.
    "fastapi>=0.121.0,<0.143",
    "uvicorn[standard]>=0.30.0,<0.55",
    "yt-dlp==2026.8.19",
    # The challenge solver scripts. Without them the Deno runtime the
    # image ships is registered but has no script to run, and every
    # YouTube extraction reports "Signature solving failed" and
    # "n challenge solving failed".
    #
    # Declared directly rather than through yt-dlp's [default] or
    # [pin] extras: both of those carry eight more packages (brotli,
    # brotlicffi, certifi, mutagen, pycryptodomex, requests, urllib3,
    # websockets) for networking backends and metadata handling this
    # service does not use. The cost is that the version has to track
    # yt-dlp by hand; test_ejs_matches_yt_dlp_requirement fails if it
    # drifts from what the installed yt-dlp asks for.
    #
    # Not --remote-components ejs:npm|github, which would fetch
    # unpinned scripts over the network on the download path.
    "yt-dlp-ejs==0.8.0",
    "slowapi>=0.1.9,<0.2",
]

[project.optional-dependencies]
dev = [
    # 9.0.3 fixes CVE-2025-71176 (insecure /tmp/pytest-of-{user} handling
    # on UNIX). Cap below 10.0 so a future major bump surfaces as a PR.
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=0.24.0,<2.0",
    "httpx>=0.27.0,<1.0",
]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "SIM",
    # The three flake8-bandit rules that catch a shell in the loop:
    # subprocess with shell=True, any other call with shell=True, and
    # os.system. Every yt-dlp and ffmpeg invocation here is list-form and
    # takes a user-supplied URL as an argument, so a shell appearing in that
    # path is the difference between an argument and a command. S603
    # ("untrusted input in subprocess") is left off deliberately: it fires on
    # every list-form call too, so it would mean a noqa on each one and a
    # habit of adding more.
    "S602",
    "S604",
    "S605",
    # The S rules above only know about subprocess and os: asyncio's own
    # shell spawner goes unflagged by all three. Verified against the ruff
    # the pre-commit hook pins, which is what CI enforces. Nothing here uses
    # asyncio subprocesses today, so this bans a door rather than closing
    # one; see flake8-tidy-imports below for what it does and does not reach.
    "TID",
]

# TID251 resolves names through imports, so it catches both the qualified
# call and the from-import (including an aliased one). It cannot catch
# `loop.subprocess_shell(...)`: that is an attribute on a local variable and
# ruff has no type to resolve it from. Verified by probe against the pinned
# ruff -- an entry for AbstractEventLoop.subprocess_shell was tried and never
# fired, so it is left out rather than kept as a check that looks like cover
# and is not. Reaching that form still needs review, not lint.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncio.create_subprocess_shell".msg = "starts a shell; use create_subprocess_exec with an argument list"
"asyncio.subprocess.create_subprocess_shell".msg = "starts a shell; use create_subprocess_exec with an argument list"

# The copied conformance test is excluded from the formatter, not from
# the linter. The three projects sharing it do not share a line length
# -- Whisper-UI uses 120, this one and voice-forge use 88 -- so each
# one's `ruff format` would rewrite the shared region differently and
# its hash could never match across all three. Measured on the template:
# at 120, ruff format joins the call arguments in `_extractors_matching`
# and collapses the implicit string concatenation in `_load_profile`.
# `ruff check` still covers the file.
[tool.ruff.format]
exclude = ["tests/test_ytdlp_conformance.py"]

# The yt-dlp conformance profile. Every value is a claim that
# tests/test_ytdlp_conformance.py checks against this repository's real
# code; see docs/ytdlp-invariants.md for what each invariant means and
# docs/ytdlp-conformance/README.md for how the three projects share the
# test.
[tool.ytdlp_conformance]
spec_version = "1.0.0"

# sha256 of the copied test's canonical region. Changing the region
# means changing this line, which is the visible part of the mechanism.
canonical_region_sha256 = "65ce3ac81219474f9ca8aa56cc8f4596f461a212147215a35186a6e00283d7fe"

# ALLOWED_EXTRACTORS in app/services/youtube.py. "youtube.*" rather than
# ["youtube", "youtube:tab"], which matched 2 of the 20 YouTube
# extractors and so rejected youtu.be/<id>?list=<id> and
# youtube.com/clip/<id>. It still excludes generic, which is the one
# that leaves YouTube.
extractor_spec = ["youtube.*"]

# C1's matrix, and C6 reuses it. The rejections are the cases that
# matter here: a non-video path on the same host that GenericIE would
# otherwise follow off-site, authority confusion, and the link-local
# metadata address.
accepts_urls = [
  "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
  "https://youtu.be/dQw4w9WgXcQ",
  "https://www.youtube.com/shorts/dQw4w9WgXcQ",
]
rejects_urls = [
  "https://www.youtube.com/about/",
  "https://youtube.com@evil.com/watch?v=dQw4w9WgXcQ",
  "http://169.254.169.254/latest/meta-data/",
]

# _base_opts() passes cachedir=False and every CLI command passes
# --no-cache-dir, so yt-dlp writes nothing to ~/.cache/yt-dlp.
cachedir = false

# VIDEO_FORMAT_SORT. H.264 and AAC are preferred over AV1 and VP9
# because far more hardware decoders handle them (#112).
codec_policy = "h264-preferred"

# SOCKET_TIMEOUT, passed on both paths: socket_timeout in _base_opts()
# and --socket-timeout in _YTDLP_BASE_ARGS.
socket_timeout_seconds = 30

# No byte ceiling is enforced anywhere in this service, and 0 says so
# rather than declaring an intent the code does not hold. Media is
# piped from yt-dlp straight to the HTTP response, so there is no
# landed file to measure and no in-process downloader to meter. What a
# ceiling should mean for a passthrough stream is the open question in
# #138; the C7 waivers below record the gap until it is answered.
max_bytes = 0

js_runtime = "deno"
# The Docker image installs Deno; local development supplies its own.
js_runtime_provided_by = "image"

# yt-dlp-ejs==0.8.0 is pinned in this file's own dependencies, so the
# solver scripts cannot drift from the yt-dlp they are paired with.
ejs_coupling = "pinned"

# This repository classifies yt-dlp failures by matching its stderr, so
# the coupling is real and has to name the version it was read against.
# Verified against yt-dlp 2026.8.19: 13 of the 15 marker strings appear
# in its source. The two that do not -- "inappropriate for some users"
# and "not a bot" -- are YouTube's own playabilityStatus wording passed
# through by yt-dlp rather than produced by it, which the code says at
# the point it declares them.
markers_verified_against = "2026.8.19"

# No PO Token provider is configured, and no code reads one.
po_token_hook = "absent"

# No player_client override. When PO Token pressure appears, the first
# response is a client that does not need one, not obtaining a token.
player_clients = ["default"]

# ffmpeg converts to MP3 and remuxes to fragmented MP4. ffprobe is not
# used: the stream summary is parsed from ffmpeg's own stderr.
needs_ffmpeg = true
needs_ffprobe = false

# Two items, both C7.selectable, both listed by node id in
# tests/conftest.py with the issue that closes them. Enforced by
# docs/ytdlp-conformance/check-conformance-drift.sh, not by anything in
# the test module; declaring it without running that script leaves it
# unenforced.
xfail_budget = 2

# Aspects this repository cannot meet, recorded rather than omitted.
# Each reason cites an issue, so the gap stays visible and countable.
[tool.ytdlp_conformance.waivers]
C5 = "error-message content is not visible through the shared adapter; see #140"
"C7.metered" = "no in-process downloading site exists and no byte ceiling is enforced; see #138"
"C7.external" = "every download shells out to the yt-dlp CLI, which reports nothing a shared test can meter; see #138"
"C7.landed" = "media is streamed to the client and never lands on disk; see #138"
"C8.deadline" = "a streamed response has no wall-clock bound; see #141"
