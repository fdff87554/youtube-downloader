name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  # No branches filter: that filter matches a pull request's *base*, so
  # restricting it to main left every pull request in a stacked series
  # with no checks at all -- only the one at the bottom targets main.
  pull_request:
# Actions are pinned to commit SHAs, not tags: a tag can be moved, and
# docker-publish below holds a token that can write packages.
permissions:
  contents: read
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: Cache pip downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install backend dependencies
        run: |
          pip install --require-hashes -r backend/requirements-dev.lock
          pip install -e backend --no-deps
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit checks
        run: python -m pre_commit run --all-files
      # The remux tests drive a real ffmpeg; without it they would skip and
      # the fragmented-MP4 path would go untested here.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run backend tests
        run: cd backend && python -m pytest tests/ -v
      # Layers 1 and 2 of the yt-dlp conformance drift control (see
      # docs/ytdlp-invariants.md): the copied test's canonical region still
      # hashes to what backend/pyproject.toml records, and no more items
      # carry an xfail marker than xfail_budget allows. Offline, and it
      # fails the build -- unlike conformance-report below, which is about
      # another repository's state and only reports.
      #
      # It runs after the suite rather than before it, because a failure
      # here is about the shared contract and is easier to read once the
      # repository's own tests have had their say.
      - name: Check yt-dlp conformance drift
        run: |
          bash docs/ytdlp-conformance/check-conformance-drift.sh \
            backend/tests/test_ytdlp_conformance.py backend/pyproject.toml
      # Signal handling in the entrypoint, with uvicorn and nginx stubbed
      # out. Needs no image, so it belongs here rather than in
      # docker-build.
      - name: Run entrypoint signal tests
        run: bash docker/entrypoint.test.sh
      - name: Run frontend tests
        run: cd frontend && npm test
      - name: Build frontend
        run: cd frontend && npm run build
  # npm-audit and pip-audit are separate jobs on purpose. As a single job they
  # ran in sequence, so a frontend finding aborted the run before pip-audit
  # executed and the red X said nothing about the backend.
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: npm audit (frontend)
        run: cd frontend && npm audit --audit-level=high
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: Cache pip downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-audit-${{ hashFiles('backend/requirements*.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-audit-
      - name: pip-audit (backend)
        run: |
          pip install pip-audit
          python -m pip_audit -r backend/requirements.lock --strict
          python -m pip_audit -r backend/requirements-dev.lock --strict
  # Layer 3 of the yt-dlp conformance drift control (see
  # docs/ytdlp-invariants.md). Report-only, and continue-on-error so that it
  # cannot fail a pull request here: a change in this repository should not be
  # blocked by another repository's state. The value is that every run prints
  # those lines, so a sibling stuck on an older spec version is visible rather
  # than merely discoverable.
  #
  # It covers this repository and Whisper-UI. voice-forge is private, and
  # reading it from here would mean this public repository's CI holding a
  # credential with read access to a private one -- the wrong trade against
  # least privilege. voice-forge runs layers 1 and 2 in its own CI, which are
  # the stronger two; the gap is written down in the spec so that it stays
  # countable rather than forgotten.
  conformance-report:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Report the conformance profile of each public sibling
        env:
          # The built-in token. It reads public repositories and nothing else,
          # which is exactly the scope this step needs.
          GH_TOKEN: ${{ github.token }}
        run: bash docs/ytdlp-conformance/report-sibling-profiles.sh
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # Was .github/workflows/docker-publish.yaml, which triggered on push to main
  # independently of CI and so published to GHCR without waiting for a single
  # check. Folding it in here lets `needs` do the gating; workflow_run would
  # have meant resolving the triggering commit by hand and working around
  # actions/checkout v7's restrictions on that event.
  docker-publish:
    needs: [lint-and-test, npm-audit, pip-audit, docker-build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Log in to Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
