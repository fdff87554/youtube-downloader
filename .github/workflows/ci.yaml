name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mise
        uses: jdx/mise-action@v4
      - name: Cache pip downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements-dev.lock
          pip install -e backend --no-deps
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit checks
        run: python -m pre_commit run --all-files
      - name: Run backend tests
        run: cd backend && python -m pytest tests/ -v
      - name: Run frontend tests
        run: cd frontend && npm test
      - name: Build frontend
        run: cd frontend && npm run build
  # npm-audit and pip-audit are separate jobs on purpose. As a single job they
  # ran in sequence, so a frontend finding aborted the run before pip-audit
  # executed and the red X said nothing about the backend.
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mise
        uses: jdx/mise-action@v4
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: npm audit (frontend)
        run: cd frontend && npm audit --audit-level=high
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mise
        uses: jdx/mise-action@v4
      - name: Cache pip downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-audit-${{ hashFiles('backend/requirements*.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-audit-
      - name: pip-audit (backend)
        run: |
          pip install pip-audit
          python -m pip_audit -r backend/requirements.lock --strict
          python -m pip_audit -r backend/requirements-dev.lock --strict
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # Was .github/workflows/docker-publish.yaml, which triggered on push to main
  # independently of CI and so published to GHCR without waiting for a single
  # check. Folding it in here lets `needs` do the gating; workflow_run would
  # have meant resolving the triggering commit by hand and working around
  # actions/checkout v7's restrictions on that event.
  docker-publish:
    needs: [lint-and-test, npm-audit, pip-audit, docker-build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
