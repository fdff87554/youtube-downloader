version: 2
updates:
  # pip is deliberately ungrouped. Dependabot only edits pyproject.toml here;
  # the lockfiles that CI and the Docker image install from have to be
  # regenerated by hand with `pip-compile --upgrade-package <pkg>`, one package
  # at a time. Grouping would fold several of those manual follow-ups into a
  # single PR and make the bookkeeping harder, not easier.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    groups:
      # Must stay ahead of dev-dependencies: the first matching group wins, and
      # tailwindcss and @tailwindcss/vite have to move together. Updating one
      # alone leaves a nested second copy of tailwindcss in package-lock.json.
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    groups:
      docker-patch:
        patterns: ["*"]
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
