services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Set ALLOWED_ORIGINS to your frontend origin (or a comma-separated
      # list) for any internet-facing deployment. Leaving it unset is only
      # permitted when DEBUG=true (local development); the application
      # refuses to start otherwise. See README "Quick start" for examples.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - DEBUG=${DEBUG:-false}
      # Comma-separated CIDRs of any reverse proxy in front of this
      # container. Leave empty when the container is the edge. Getting
      # this wrong does not fail loudly -- it silently merges every
      # client into one rate-limit bucket. See README "Configuration".
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
    restart: unless-stopped
    # Enforce the no-disk-I/O invariant rather than trusting the code
    # to honour it: the image is immutable at runtime and the only
    # writable path is a tmpfs holding nginx's temp dirs, its pid file,
    # the generated real-ip config and Deno's cache.
    read_only: true
    tmpfs:
      - /tmp
    # Ceilings for the subprocess-per-download model. nginx caps
    # concurrent connections per client; these cap what the container
    # as a whole can consume if that is not enough.
    pids_limit: 256
    mem_limit: 1g
