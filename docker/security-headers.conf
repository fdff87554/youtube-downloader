# Defense-in-depth response headers, included once per location.
#
# nginx's add_header does not merge across configuration levels: a
# location that declares any add_header of its own drops every
# add_header inherited from http/server. /assets/ and /api/ both set
# Cache-Control, so defining these at http level silently left both
# without a single security header. Including this file in each
# location keeps them in one place without relying on inheritance.
#
# The site is also expected to sit behind a TLS-terminating proxy that
# adds HSTS.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# $content_security_policy is defined by the map in nginx.conf: the
# site policy for everything, loosened for the debug-only docs page.
add_header Content-Security-Policy $content_security_policy always;
