worker_processes auto;
pid /tmp/nginx.pid;
# Send logs to the container's stdout/stderr so `docker logs` works and
# we never need to chown /var/log/nginx for non-root operation.
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Default error pages name the exact nginx version in the body.
    server_tokens off;

    access_log /dev/stdout;

    sendfile on;
    keepalive_timeout 65;

    # Compress text-like responses. Vite already produces minified output,
    # so the win comes mostly from gzipping the index.html shell.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # Written by entrypoint.sh from TRUSTED_PROXIES on every start, so it
    # always exists (empty when the container is the edge). It carries the
    # set_real_ip_from directives that make $remote_addr the real client
    # rather than an upstream proxy -- both rate limits below key on that.
    include /tmp/nginx-real-ip.conf;

    # One CSP for the site, and a looser one for /api/docs.
    #
    # Swagger UI loads its bundle and stylesheet from a CDN and boots
    # from an inline script, all of which the site policy refuses --
    # which left the page a working 200 with a blank body. Rather than
    # vendoring and re-templating Swagger UI for a page that only
    # exists when DEBUG is on (it is a 404 otherwise), allow those
    # sources on that one path. Everything else keeps the strict policy.
    map $uri $content_security_policy {
        default "default-src 'self'; img-src 'self' https://*.ytimg.com https://*.googleusercontent.com data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
        /api/docs "default-src 'self'; img-src 'self' https://fastapi.tiangolo.com data:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    }

    # Defense-in-depth rate limit. The application also enforces per-route
    # limits with slowapi; this zone catches abusive clients before they
    # reach uvicorn.
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_status 429;

    # Temp paths for non-root operation
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;

    server {
        listen 8080;

        # Errors raised by nginx itself (rate limit, dead upstream) must
        # carry the same envelope the application uses. The frontend
        # parses every non-2xx body as that shape, so the stock HTML
        # page surfaced as a JSON syntax error instead of a message.
        error_page 429 = @rate_limited;
        error_page 502 503 504 = @upstream_unavailable;

        location @rate_limited {
            include /etc/nginx/security-headers.conf;
            default_type application/json;
            add_header Retry-After 60 always;
            return 429 '{"error":{"code":"rate_limited","message":"Too many requests. Please slow down and try again."}}';
        }

        # 502/504 collapse into 503: to the caller they are the same
        # "upstream is not answering right now, retry later".
        location @upstream_unavailable {
            include /etc/nginx/security-headers.conf;
            default_type application/json;
            return 503 '{"error":{"code":"service_unavailable","message":"The service is temporarily unavailable. Please try again."}}';
        }

        # Serve static frontend files
        location / {
            include /etc/nginx/security-headers.conf;
            root /var/www/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Vite emits content-hashed filenames under /assets/, so the
        # response body for a given URL never changes -- cache aggressively.
        location /assets/ {
            include /etc/nginx/security-headers.conf;
            root /var/www/html;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            access_log off;
            try_files $uri =404;
        }

        # Reverse proxy API requests to uvicorn
        location /api/ {
            include /etc/nginx/security-headers.conf;
            limit_req zone=api burst=20 nodelay;

            # API responses are dynamic and must never be cached.
            add_header Cache-Control "no-store" always;

            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Streaming support: disable buffering for download responses
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
